name: growth_platform
version: "1.0.0"
config-version: 2

profile: growth_platform

model-paths: ["models"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Source freshness / staleness thresholds are expressed in hours against
  # each source table's own config (see models/staging/*/_*__sources.yml).
  # Kept here only as documentation of the policy, not consumed directly.
  staging_freshness_warn_after_hours: 24
  staging_freshness_error_after_hours: 48

  # Phase 6: how many days before each incremental model's own high-water
  # mark (max _ingested_at already processed) to re-scan on every run, so
  # late-arriving/updated source rows are picked up without a full
  # historical rebuild. See docs/incremental_processing.md for the full
  # rationale and its documented limits (a late arrival older than this
  # window requires a manual --full-refresh - see that doc's "Recovery").
  incremental_lookback_days: 3

models:
  growth_platform:
    staging:
      +schema: staging
      +materialized: view
      +tags: ["staging"]
      app:
        +tags: ["app"]
      billing:
        +tags: ["billing"]
      product:
        +tags: ["product"]
      api:
        +tags: ["api"]
      crm:
        +tags: ["crm"]
      marketing:
        +tags: ["marketing"]
    intermediate:
      +schema: intermediate
      +materialized: view
      +tags: ["intermediate"]
    marts:
      +schema: analytics
      +materialized: table
      dimensions:
        +tags: ["dimensions"]
      facts:
        +tags: ["facts"]
      growth:
        +tags: ["growth"]
      revenue:
        +tags: ["revenue"]
