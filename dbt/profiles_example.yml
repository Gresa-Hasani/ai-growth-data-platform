# Copy to ~/.dbt/profiles.yml (or run dbt with --profiles-dir dbt) and fill in from your .env.
# Not committed as `profiles.yml` — see dbt/../.gitignore.
#
# dbt runs on the HOST (like the ingestion CLI - see docs/ingestion.md), so it needs
# the host-mapped Postgres port (5433, not 5432 - a native Postgres service commonly
# already owns 5432 on dev machines). DBT_POSTGRES_HOST/DBT_POSTGRES_PORT default to
# that host-side address; override them if your setup differs.
growth_platform:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_POSTGRES_HOST', 'localhost') }}"
      port: "{{ env_var('DBT_POSTGRES_PORT', '5433') | as_number }}"
      user: "{{ env_var('POSTGRES_USER') }}"
      password: "{{ env_var('POSTGRES_PASSWORD') }}"
      dbname: "{{ env_var('POSTGRES_DB') }}"
      schema: analytics
      threads: 4
