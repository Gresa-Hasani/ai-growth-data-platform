version: 2

models:
  - name: fact_subscriptions
    description: >
      One row per source subscription_id - identical grain to
      int_user_subscription_history, with dimension surrogate keys
      resolved on top. Unmatched-key policy (applied consistently across
      every fact): a NULL dimension key paired with an explicit boolean
      flag, never a fabricated "unknown" dimension row.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - subscription_id
    columns:
      - name: subscription_id
        description: Technical primary key, inherited unchanged from staging/intermediate.
        data_tests:
          - not_null
          - unique
      - name: user_key
        description: FK to dim_users.user_key; NULL when is_user_orphaned.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_key
              config:
                severity: warn
                where: "user_key is not null"
      - name: organization_key
        description: FK to dim_organizations.organization_key; NULL when is_organization_unmatched.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_organizations')
                field: organization_key
              config:
                severity: warn
                where: "organization_key is not null"
      - name: plan_key
        description: FK to dim_plans.plan_key.
      - name: is_recurring_active_now
        description: >
          Via the is_subscription_recurring_active macro - status = 'active',
          or 'canceled' with a still-future cancelled_at (a scheduled, not-
          yet-effective cancellation). The single source of truth for "is
          this subscription generating revenue right now," reused unchanged
          by mart_mrr/mart_arr/mart_customer_churn/mart_revenue_churn/mart_arpu.
      - name: currency
        description: Normalized currency code. Never summed across currencies downstream.
      - name: subscription_amount
        description: Raw recurring amount for this subscription's own billing_interval.
        data_tests:
          - positive_or_zero
      - name: monthly_equivalent_amount
        description: subscription_amount normalized to a monthly figure (annual / 12) via the monthly_equivalent_amount macro - the basis for every MRR/ARR/ARPU calculation.
        data_tests:
          - positive_or_zero

  - name: fact_invoices
    description: >
      One row per source invoice_id - identical grain to
      int_customer_revenue, with dimension surrogate keys resolved on top.
      Incremental as of Phase 6 (materialized='incremental', unique_key=
      'invoice_id', delete+insert) - see docs/incremental_processing.md.
      raw.invoices has no updated_at; _ingested_at (from stg_billing__invoices)
      is the only available change-detection signal, used with a
      configurable lookback (var incremental_lookback_days, default 3).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - invoice_id
    columns:
      - name: invoice_id
        description: Technical primary key, inherited unchanged from staging/intermediate. Also this model's incremental unique_key.
        data_tests:
          - not_null
          - unique
      - name: _last_ingested_at
        description: The invoice's own _ingested_at from staging - this run's high-water mark input for the next incremental run.
        data_tests:
          - not_null
      - name: organization_key
        description: FK to dim_organizations.organization_key; NULL when is_organization_unmatched.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_organizations')
                field: organization_key
              config:
                severity: warn
                where: "organization_key is not null"
      - name: plan_key
        description: FK to dim_plans.plan_key, via the invoice's subscription.
      - name: billed_amount
        description: Passthrough from int_customer_revenue.
        data_tests:
          - positive_or_zero
      - name: paid_amount
        description: Passthrough from int_customer_revenue.
        data_tests:
          - positive_or_zero
      - name: outstanding_amount
        description: Passthrough from int_customer_revenue.
        data_tests:
          - positive_or_zero

  - name: fact_product_usage
    description: >
      One row per (date_day, user_id, organization_id, event_name) -
      unchanged grain from Phase 4/5. Incremental as of Phase 6
      (materialized='incremental', unique_key='usage_grain_key',
      delete+insert) - see docs/incremental_processing.md. Rebuilds every
      affected calendar date FROM ALL of that date's events whenever any
      event for that date was ingested within the lookback window
      (var incremental_lookback_days, default 3 days), so late arrivals
      correctly add to - never duplicate - that date's totals.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - usage_grain_key
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date_day
              - user_key
              - organization_key
              - event_name
    columns:
      - name: usage_grain_key
        description: >
          dbt_utils.generate_surrogate_key over the COALESCE-guarded grain
          columns - the actual incremental unique_key. Exists because
          user_id/organization_id are legitimately nullable, and
          delete+insert's equality-based row matching cannot replace a
          NULL-keyed row on rerun without this.
        data_tests:
          - not_null
          - unique
      - name: date_day
        description: Calendar date of the events (event time, not ingestion time).
        data_tests:
          - not_null
      - name: user_id
        description: Raw nullable business key, re-exposed in Phase 6 alongside user_key (a Phase 5 gap fixed for the incremental grain key - see model SQL).
      - name: organization_id
        description: Raw nullable business key, re-exposed in Phase 6 alongside organization_key.
      - name: event_count
        description: Passthrough from int_daily_product_usage.
        data_tests:
          - positive_or_zero
      - name: _last_ingested_at
        description: Max _ingested_at among the events contributing to this row - this run's high-water mark input for the next incremental run.
        data_tests:
          - not_null

  - name: fact_api_usage
    description: >
      One row per (date_day, organization_id) - unchanged grain from
      Phase 4/5. Incremental as of Phase 6 (materialized='incremental',
      unique_key='usage_grain_key', delete+insert) - identical strategy to
      fact_product_usage, applied to raw.api_usage.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - usage_grain_key
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date_day
              - organization_key
    columns:
      - name: usage_grain_key
        description: dbt_utils.generate_surrogate_key over the COALESCE-guarded grain - the actual incremental unique_key (organization_id is nullable; see fact_product_usage for why this is needed).
        data_tests:
          - not_null
          - unique
      - name: date_day
        description: Calendar date of the requests.
        data_tests:
          - not_null
      - name: request_count
        description: Passthrough from int_api_usage_by_customer.
        data_tests:
          - positive_or_zero
      - name: error_rate
        description: Passthrough from int_api_usage_by_customer (via safe_divide).
        data_tests:
          - percentage_between_zero_and_one
      - name: _last_ingested_at
        description: Max _ingested_at among the requests contributing to this row - this run's high-water mark input for the next incremental run.
        data_tests:
          - not_null
