services:
  postgres:
    image: postgres:16-alpine
    container_name: growth_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_DB: ${POSTGRES_DB:-growth_platform}
    ports:
      # Host port 5433, not 5432: many dev machines already run a native
      # Postgres service on 5432, which silently intercepts the container's
      # port mapping. Host-side tools (ingestion, dbt, psql) must therefore
      # connect via localhost:5433. Inter-container traffic (analytics-api ->
      # postgres) is unaffected: it uses the "postgres" service name on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/init_schemas.sql:/docker-entrypoint-initdb.d/01_init_schemas.sql:ro
      - ./app/db/raw_tables.sql:/docker-entrypoint-initdb.d/02_raw_tables.sql:ro
      - ./app/db/monitoring_tables.sql:/docker-entrypoint-initdb.d/03_monitoring_tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analytics} -d ${POSTGRES_DB:-growth_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  analytics-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: growth_platform_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://analytics:change_me_locally@postgres:5432/growth_platform}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
