services:
  postgres:
    image: postgres:16-alpine
    container_name: growth_platform_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
      POSTGRES_DB: ${POSTGRES_DB:-growth_platform}
    ports:
      # Default host port 5433, not 5432: many dev machines already run a
      # native Postgres service on 5432, which silently intercepts the
      # container's port mapping. Host-side tools (ingestion, dbt, psql)
      # must therefore connect via localhost:${POSTGRES_HOST_PORT:-5433}.
      # Inter-container traffic (analytics-api -> postgres) is unaffected:
      # it uses the "postgres" service name on 5432 regardless.
      # Parameterized (not hardcoded) so a machine where 5433 is ALSO
      # already taken (e.g. by an unrelated project) can override via
      # POSTGRES_HOST_PORT in .env without editing this file.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/db/init_schemas.sql:/docker-entrypoint-initdb.d/01_init_schemas.sql:ro
      - ./app/db/raw_tables.sql:/docker-entrypoint-initdb.d/02_raw_tables.sql:ro
      - ./app/db/monitoring_tables.sql:/docker-entrypoint-initdb.d/03_monitoring_tables.sql:ro
      - ./app/db/quality_tables.sql:/docker-entrypoint-initdb.d/04_quality_tables.sql:ro
      - ./app/db/ai_query_logs.sql:/docker-entrypoint-initdb.d/05_ai_query_logs.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-analytics} -d ${POSTGRES_DB:-growth_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  analytics-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: growth_platform_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://analytics:change_me_locally@postgres:5432/growth_platform}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # LLM_PROVIDER defaults to "ollama" even when unset (see
      # app/agent/config.py) - nothing here forces a commercial provider.
      # "localhost" inside THIS container is the container itself, not the
      # host running Ollama - OLLAMA_BASE_URL must point at
      # host.docker.internal (enabled below via extra_hosts) when Ollama
      # runs on the host. See docs/ai_data_analyst_agent.md "Docker networking".
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-haiku-latest}
    extra_hosts:
      # Makes host.docker.internal resolve on Linux too (Docker Desktop on
      # Mac/Windows already provides it natively) - needed only when Ollama
      # runs on the host rather than as its own container.
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # /ready (not /health) - Phase 8 split liveness from readiness;
      # Docker's healthcheck should gate on the DB-backed check (readiness),
      # the same behavior this healthcheck always had, just under its
      # correct name now. See app/main.py.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
