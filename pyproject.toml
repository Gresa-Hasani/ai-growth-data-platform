[project]
name = "ai-growth-data-platform"
version = "0.1.0"
description = "Production-grade analytics platform for a fast-growing AI SaaS company: ELT pipelines, dbt modeling, self-service API, and a secure AI data analyst agent."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "typer>=0.12",
    "faker>=30.0",
    "numpy>=2.0",
    "httpx>=0.27",
    # Structured PostgreSQL SQL parsing for app/security/sql_validator.py -
    # already resolved transitively via dbt-core; pinned directly here since
    # app/security imports it explicitly and must not break if dbt's own
    # dependency graph ever drops/shifts it.
    "sqlglot>=23.0",
]

[project.optional-dependencies]
# Ollama (the default provider) only needs httpx, already a core dependency -
# so the platform runs with zero extra installs. OpenAI/Anthropic SDKs are
# genuinely optional: installing/using Ollama never requires them.
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.40"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "ingestion*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = [
    "B008",   # Depends()/Query() in a default argument IS the FastAPI dependency-injection idiom
    "DTZ011", # date.today() is intentional here - these are calendar dates (matching mart `date` columns), not timestamps
    "UP046",  # Pydantic v2 generic models still need `Generic[T]`, not PEP 695 `class Page[T]`, for runtime resolution
]

[tool.pytest.ini_options]
testpaths = ["tests"]
