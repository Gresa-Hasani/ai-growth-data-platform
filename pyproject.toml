[project]
name = "ai-growth-data-platform"
version = "0.1.0"
description = "Production-grade analytics platform for a fast-growing AI SaaS company: ELT pipelines, dbt modeling, self-service API, and a secure AI data analyst agent."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",
    "python-dotenv>=1.0",
    "structlog>=24.4",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
